<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project — Stephen Zhu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="page-project">
  <header class="site-header" id="top">
    <nav class="nav container">
      <a class="nav__logo" href="index.html#top">SZ</a>
      <button class="nav__toggle" aria-label="Toggle menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <ul class="nav__links">
        <li><a href="index.html#about">About</a></li>
        <li><a href="index.html#projects">Projects</a></li>
        <li><a href="index.html#contact">Contact</a></li>
        <li><a class="nav__cta" href="https://github.com/Ezimakyu" target="_blank" rel="noopener">GitHub</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <article class="project-detail" id="project-detail">
      <div class="container project-detail__container">
        <a class="project-detail__back" href="index.html#projects">&larr; Back to projects</a>

        <header class="project-detail__header reveal">
          <div class="project-detail__meta">
            <span class="project-detail__status" id="detail-status">Project</span>
            <span class="project-detail__year" id="detail-year"></span>
          </div>
          <h1 class="project-detail__title" id="detail-title">Loading…</h1>
          <p class="project-detail__tagline" id="detail-tagline"></p>
        </header>

        <!-- Thumbnail placeholder / media -->
        <div class="project-detail__media reveal" id="detail-media">
          <div class="project-detail__placeholder">
            <span>Thumbnail / GIF coming soon</span>
          </div>
        </div>

        <div class="project-detail__body reveal">
          <section class="project-detail__section">
            <h2>Overview</h2>
            <div id="detail-summary"></div>
          </section>

          <section class="project-detail__section">
            <h2>What I did</h2>
            <div id="detail-details"></div>
          </section>

          <section class="project-detail__section">
            <h2>Tech stack</h2>
            <ul class="project-detail__tech" id="detail-tech"></ul>
          </section>

          <section class="project-detail__section project-detail__actions">
            <a class="btn btn--primary" id="detail-repo" href="#" target="_blank" rel="noopener">View on GitHub</a>
            <a class="btn btn--ghost" href="index.html#projects">All projects</a>
          </section>
        </div>
      </div>
    </article>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; <span id="year"></span> Stephen Zhu.</p>
    </div>
  </footer>

  <script>
    const toggle = document.querySelector('.nav__toggle');
    const links = document.querySelector('.nav__links');
    toggle.addEventListener('click', () => {
      const expanded = toggle.getAttribute('aria-expanded') === 'true';
      toggle.setAttribute('aria-expanded', String(!expanded));
      links.classList.toggle('is-open');
    });
    links.querySelectorAll('a').forEach((a) => a.addEventListener('click', () => {
      toggle.setAttribute('aria-expanded', 'false');
      links.classList.remove('is-open');
    }));
  </script>
  <script src="js/project.js" type="module"></script>
</body>
</html>
